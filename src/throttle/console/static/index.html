<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Throttle Console</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side" aria-label="Navigation">
      <a class="brand" href="#/quickstart" aria-label="Throttle Console home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 13l4-4"/></svg>
        throttle <small id="ver"></small>
      </a>
      <nav id="nav"></nav>
      <div class="side-foot"><span class="dot" aria-hidden="true"></span><span>Local only · 127.0.0.1</span></div>
    </aside>
    <div class="main">
      <header class="top">
        <button class="menu-btn" id="menu" type="button" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="tabs" aria-label="Sections">
          <button class="tab" type="button" data-tab="console">Console</button>
          <button class="tab" type="button" data-tab="docs">Docs</button>
          <button class="tab" type="button" data-tab="cli">CLI Reference</button>
        </nav>
        <button class="search-btn" id="searchBtn" type="button" aria-label="Search docs and checks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Search or ask</span><kbd>⌘K</kbd>
        </button>
      </header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>
  <button class="ask" id="askBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
    Ask
  </button>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
