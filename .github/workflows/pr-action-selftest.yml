name: PR action self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-action-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Throttle for GitHub on this pull request (no comment)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run the action from this checkout
        id: throttle
        uses: ./.github/actions/throttle-pr
        with:
          throttle-version: ${{ github.workspace }}
          comment: "false"

      - name: Throttle's own code makes no AI calls, so nothing changed
        env:
          CHANGED: ${{ steps.throttle.outputs.changed-jobs }}
          COMMENT: ${{ steps.throttle.outputs.comment-file }}
        run: |
          test "$CHANGED" = "0"
          grep -q "throttle:pr-check" "$COMMENT"
