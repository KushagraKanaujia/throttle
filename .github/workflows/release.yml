name: Release

# Publishes throttle-pro to PyPI when a GitHub release is published:
#   bump version in pyproject.toml, merge to main
#   gh release create vX.Y.Z --generate-notes
# Authenticates with PyPI trusted publishing (OIDC), so no API token is stored
# anywhere. The throttle-pro project on pypi.org must list this repository,
# this workflow file (release.yml) and the "pypi" environment as a trusted
# publisher. A version that is already on PyPI is skipped, not re-uploaded.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: "1725148800"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes -r ci/requirements-build.lock

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            printf 'tag %s does not match pyproject version %s\n' "${GITHUB_REF_NAME}" "${version}" >&2
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          python -m build --no-isolation --outdir dist
          python ci/verify_wheel.py dist/*.whl
          ls -l dist

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/throttle-pro/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
