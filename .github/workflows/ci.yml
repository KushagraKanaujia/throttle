name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / warning-strict offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache HuggingFace Hub directory
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2

      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes \
            -r ci/requirements-build.lock \
            -r ci/requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check

      - name: Install embeddings extra and pre-download model weights
        run: |
          python -m pip install 'onnxruntime>=1.16.0,<2' 'tokenizers>=0.15.0,<1' 'numpy>=1.24.0,<3' 'huggingface-hub>=0.20.0,<1'
          python -m pip check
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='sentence-transformers/all-MiniLM-L6-v2', filename='onnx/model.onnx'); hf_hub_download(repo_id='sentence-transformers/all-MiniLM-L6-v2', filename='tokenizer.json')"

      - name: Verify the offline guard and run the full suite
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/offline_guard
          PYTHONWARNINGS: error
          HF_HUB_OFFLINE: "1"
        run: |
          python ci/verify_offline_guard.py
          python -m compileall -q -f src tests ci
          echo "Collecting tests..."
          python -m pytest tests --collect-only -q 2>&1 | tail -5
          python ci/run_tests.py --start-directory tests

  package:
    name: Clean wheel and source parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Fix ZIP member timestamps so repeated builds from the same source are stable.
      SOURCE_DATE_EPOCH: "1725148800"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Cache HuggingFace Hub directory
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2

      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes \
            -r ci/requirements-build.lock \
            -r ci/requirements-runtime.lock

      - name: Build and inspect one wheel
        id: wheel
        env:
          PYTHONWARNINGS: error
        run: |
          wheelhouse="${RUNNER_TEMP}/throttle-wheelhouse"
          python -m build --wheel --no-isolation --outdir "${wheelhouse}"

          mapfile -t wheels < <(find "${wheelhouse}" -maxdepth 1 -type f -name '*.whl' -print)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            printf 'expected exactly one wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi

          python ci/verify_wheel.py "${wheels[0]}"
          printf 'path=%s\n' "${wheels[0]}" >> "${GITHUB_OUTPUT}"

      - name: Install and test only the built wheel in a clean environment
        env:
          PYTHONWARNINGS: error
        run: |
          clean_env="${RUNNER_TEMP}/throttle-clean-wheel"
          python -m venv "${clean_env}"
          "${clean_env}/bin/python" -m pip install --require-hashes \
            -r ci/requirements-runtime.lock
          "${clean_env}/bin/python" -m pip install --no-deps "${{ steps.wheel.outputs.path }}"
          "${clean_env}/bin/python" -m pip check
          "${clean_env}/bin/throttle" --version

          # Verify proxy subcommand exists with --enable-cache flag
          if ! "${clean_env}/bin/throttle" proxy --help | grep -q -- '--enable-cache'; then
            printf 'ERROR: proxy subcommand missing --enable-cache flag\n' >&2
            exit 1
          fi

          # Install embeddings extra and pre-download model weights
          "${clean_env}/bin/python" -m pip install 'onnxruntime>=1.16.0,<2' 'tokenizers>=0.15.0,<1' 'numpy>=1.24.0,<3' 'huggingface-hub>=0.20.0,<1'
          "${clean_env}/bin/python" -m pip check
          "${clean_env}/bin/python" -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='sentence-transformers/all-MiniLM-L6-v2', filename='onnx/model.onnx'); hf_hub_download(repo_id='sentence-transformers/all-MiniLM-L6-v2', filename='tokenizer.json')"

          cd "${RUNNER_TEMP}"
          PYTHONPATH="${GITHUB_WORKSPACE}/ci/offline_guard" \
            "${clean_env}/bin/python" "${GITHUB_WORKSPACE}/ci/verify_installed_wheel.py" \
            --workspace "${GITHUB_WORKSPACE}"
          PYTHONPATH="${GITHUB_WORKSPACE}/ci/offline_guard" \
            "${clean_env}/bin/python" "${GITHUB_WORKSPACE}/ci/verify_offline_guard.py"
          PYTHONPATH="${GITHUB_WORKSPACE}/ci/offline_guard" \
            HF_HUB_OFFLINE=1 \
            "${clean_env}/bin/python" "${GITHUB_WORKSPACE}/ci/run_tests.py" \
            --start-directory "${GITHUB_WORKSPACE}/tests"

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: throttle-wheel-python-3.14
          path: ${{ steps.wheel.outputs.path }}
          retention-days: 30

  integration:
    name: Integration tests against live Ollama backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        run: |
          ollama serve &
          sleep 5

      - name: Pull required models
        run: |
          ollama pull llama3.2:1b
          ollama pull llama3.2:3b

      - name: Install locked dependencies and throttle
        run: |
          python -m pip install --require-hashes \
            -r ci/requirements-build.lock \
            -r ci/requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check

      - name: Run integration tests
        run: |
          echo "Collecting tests..."
          python -m pytest tests/test_proxy_integration.py tests/test_proxy.py             --collect-only -q 2>&1 | tail -3
          python -m pytest tests/test_proxy_integration.py tests/test_proxy.py             -v --tb=short             --deselect tests/test_proxy.py::test_proxy_cache_hit_with_real_http_client             --deselect tests/test_proxy.py::test_proxy_streaming_with_cache
