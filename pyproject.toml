[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "throttle-pro"
version = "0.6.0"
description = "Find and prove inference savings for agent workloads on your own GPUs: $/M tokens with 95% CIs, calibrated verdicts and verified-savings statements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
]

[project.urls]
Homepage = "https://www.throttle-pro.com"
Source = "https://github.com/KushagraKanaujia/throttle"
Documentation = "https://github.com/KushagraKanaujia/throttle/blob/main/docs/METHODOLOGY.md"
Changelog = "https://github.com/KushagraKanaujia/throttle/blob/main/CHANGELOG.md"
Issues = "https://github.com/KushagraKanaujia/throttle/issues"
Pilot = "https://www.throttle-pro.com/pilot"

[project.scripts]
throttle = "throttle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
throttle = [
    "prompts.jsonl",
    "warmup_prompts.jsonl",
    "console/static/*",
    "console/static/vendor/*",
    "console/static/illustrations/*",
    "console/docs/*.md",
    "console/docs/*/*.md",
    "_vendor/*.txt",
]

[project.optional-dependencies]
# GuideLLM stays out of process. Its current supported Python range ends at
# 3.13, so the base Throttle install remains usable on newer interpreters.
guidellm = ["guidellm[recommended]==0.7.3; python_version < '3.14'"]

# Embeddings for semantic cache tier (optional)
embeddings = [
    "onnxruntime>=1.16.0,<2",
    "tokenizers>=0.15.0,<1",
    "numpy>=1.24.0,<3",
    "huggingface-hub>=0.20.0,<1",
]

# Config file support (optional)
config = ["pyyaml>=6.0,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # huggingface-hub 0.36.2 uses deprecated hf-xet API internally
    "ignore:hf_xet\\.download_files\\(\\) is deprecated:DeprecationWarning:huggingface_hub\\.file_download",
]
